<!-- RSVP section -->
<section id="rsvp" style="text-align:center; padding-top:10px; padding-bottom:10px; margin-top:0;">

<form id="rsvpForm" style="display:inline-block; text-align:center; max-width:500px; width:90%; margin-top:5px;">
  <div class="rsvp-fields" style="display:flex; justify-content:center; flex-wrap:wrap; gap:5px; margin-bottom:5px;">
    <input type="text" id="fullName" name="fullName" placeholder="Your Full Name" required style="flex:1 0 120px; padding:8px; max-width:180px;">
    <input type="text" id="guestName" name="guestName" placeholder="Guest Full Name" style="flex:1 0 120px; padding:8px; max-width:180px;">
	<input type="text" id="room" name="room" placeholder="Need Room? (Yes/No)" style="flex:1 0 120px; padding:8px; max-width:180px;">
</div>

<button type="submit" class="rsvp-button">Submit RSVP</button>

</form>

<p id="responseMessage" style="margin-top:5px; font-weight:bold;"></p>
</section>

<footer>
  <p>© 2026 John Welsh</p>
</footer>
  
<script>
const snowContainer = document.querySelector('.snow-container');
const numberOfSnowflakes = 50; // adjust for heavier or lighter snowfall

for (let i = 0; i < numberOfSnowflakes; i++) {
  const snowflake = document.createElement('div');
  snowflake.classList.add('snowflake');
  snowflake.textContent = '❄';  // you can use other unicode snowflakes too
  snowflake.style.left = Math.random() * 100 + 'vw'; // random horizontal position
  snowflake.style.animationDuration = 5 + Math.random() * 10 + 's'; // random speed
  snowflake.style.fontSize = 5 + Math.random() * 15 + 'px'; // random size
  snowContainer.appendChild(snowflake);
}
</script>
  
<script>
    const collapsibles = document.querySelectorAll(".collapsible");
    collapsibles.forEach(btn => {
      btn.addEventListener("click", function() {
        this.classList.toggle("active");
        const content = this.nextElementSibling;
        if (content.style.maxHeight) {
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    });
</script>

<script>
document.getElementById("rsvpForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const form = this;
  const responseMessage = document.getElementById("responseMessage");
  
  const formData = new FormData(form);

  fetch("https://script.google.com/macros/s/AKfycbyc-cWbZzIVD_zXdAuVqDJzA7CZ5j8V7mgdZ-muPxtNQU-WSmWI3PLGOIZD92rJR5lzKA/exec", {
    method: "POST",
    mode: "no-cors",
    body: new URLSearchParams(formData)
  })
  .then(() => {
    responseMessage.textContent =
      "✅ Thank you for your response!";
    
	form.reset();
  })
  .catch((error) => {
    responseMessage.textContent =
      "⚠️ Something went wrong. Please try again.";
    
	console.error(error);
  });
});
</script>
